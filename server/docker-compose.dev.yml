services:
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecom
    ports:
      - '5432:5432'
    volumes:
      - ecom-pgdata:/var/lib/postgresql/data

volumes:
  ecom-pgdata:
